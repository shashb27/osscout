[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osscout"
version = "0.5.0"
description = "Screen upstream repos and issues for OSS-contribution viability: merge culture, competing PRs, farm windows, PR-welcome mining."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shashb27", email = "210754767+shashb27@users.noreply.github.com" }]
keywords = ["open-source", "contribution", "github", "triage"]

[project.urls]
Homepage = "https://github.com/shashb27/osscout"
Issues = "https://github.com/shashb27/osscout/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
osscout = "osscout.cli:main"

[tool.setuptools.packages.find]
include = ["osscout*"]
