[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osscout"
version = "0.5.1"
description = "Screen upstream repos and issues for OSS-contribution viability: merge culture, competing PRs, farm windows, PR-welcome mining."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shashb27" }]
keywords = ["open-source", "contribution", "github", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/shashb27/osscout"
Issues = "https://github.com/shashb27/osscout/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
osscout = "osscout.cli:main"

[tool.setuptools.packages.find]
include = ["osscout*"]
